<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fib 共振即時看盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* VOICE: 冷靜的交易終端，數字優先
   IDEA: 券商看盤軟體的報價表 + 線圖，共振區像畫在圖上的色帶
   PICTURE: 大型 K 線圖，Fib 線依共振分數著色
   COLOUR/TYPE: 炭黑底；台股紅漲綠跌；共振區用群青；Noto Sans TC + Inter 數字
   LAYOUT: 上方控制列，左報價表右線圖；手機堆疊 */
:root{color-scheme:light dark;--bg:light-dark(#f6f6f4,#121316);--panel:light-dark(#fff,#1b1d22);--ink:light-dark(#16171a,#e9eaee);--mute:light-dark(#6b6e76,#8d919b);--line:light-dark(#e3e3e0,#2a2d34);--up:#e03131;--dn:#1f9d55;--zone:#3b5bdb;--hot:light-dark(#fff1c2,#3a3216)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:14px max(3vw,12px);border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:19px;margin:0 12px 0 0;font-weight:700}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1}
input,select,button{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--zone);outline-offset:1px}
#token{width:170px}#proxy{width:200px}#list{flex:1;min-width:200px}
button{cursor:pointer;background:var(--zone);color:#fff;border-color:var(--zone);font-weight:600}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
#status{font-size:13px;color:var(--mute)}
#status b{color:var(--up)}
#mkt{display:flex;flex-wrap:wrap;gap:8px;width:100%}#mkt:empty{display:none}
.mk{font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}.mk b{font-size:17px;margin:0 4px}.mk small{color:var(--mute);margin-left:6px}
main{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:0;min-height:calc(100vh - 72px)}
#left{border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 72px)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--mute);font-weight:500;text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
th:first-child,td:first-child{text-align:left}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover{background:color-mix(in srgb,var(--zone) 8%,transparent)}
tr.sel{background:color-mix(in srgb,var(--zone) 14%,transparent)!important}
tr.hit td{background:var(--hot)}
.nm{font-size:12px;color:var(--mute);display:block}
.up{color:var(--up)}.dn{color:var(--dn)}
.sc{display:inline-block;min-width:34px;padding:1px 6px;border-radius:6px;font-weight:600;text-align:center}
.hits{font-size:11px;color:var(--mute);white-space:normal;text-align:left!important;padding-top:0}
#right{display:flex;flex-direction:column;padding:12px max(2vw,10px);gap:10px}
#title{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
#title h2{margin:0;font-size:24px}
#title .px{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
#chart{position:relative;flex:1;min-height:420px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
#levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.lv{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-variant-numeric:tabular-nums}
.lv b{font-size:17px}.lv small{display:block;color:var(--mute);font-size:12px}
.lv.best{border-color:var(--zone);box-shadow:inset 3px 0 0 var(--zone)}
.empty{padding:40px 20px;color:var(--mute);text-align:center}
#toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:9}
.t{background:var(--zone);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 6px 20px #0004;max-width:320px}
details{font-size:13px;color:var(--mute);padding:8px 12px}
@media(max-width:860px){main{grid-template-columns:1fr}#left{max-height:none;border-right:0;border-bottom:1px solid var(--line)}#chart{min-height:360px}#token,#proxy{width:100%}}
@media(prefers-reduced-motion:no-preference){tr.flash td{animation:fl 1s}@keyframes fl{from{background:color-mix(in srgb,var(--zone) 30%,transparent)}}}
</style>
</head>
<body>
<header>
  <h1>Fib 共振即時看盤</h1>
  <div class="ctl">
    <input id="token" type="password" placeholder="FinMind token" autocomplete="off">
    <input id="proxy" placeholder="即時代理網址（選填）" autocomplete="off">
    <input id="list" placeholder="代號，逗號分隔" value="2330,5309,8064,5289,5351,6121,3036,4958">
    <select id="iv" aria-label="更新頻率"><option value="15">15 秒</option><option value="30" selected>30 秒</option><option value="60">60 秒</option><option value="0">手動</option></select>
    <button id="go">開始</button>
    <button id="notify" class="ghost">通知</button>
  </div>
  <span id="status">尚未連線</span>
  <div id="mkt"></div>
</header>
<main>
  <section id="left">
    <table>
      <thead><tr><th>股票</th><th>現價</th><th>漲跌</th><th>共振位</th><th>距離</th><th>分數</th></tr></thead>
      <tbody id="tb"><tr><td colspan="6" class="empty">輸入 token 與觀察名單後按「開始」</td></tr></tbody>
    </table>
    <details><summary>評分規則</summary>
      每條 Fib 回撤線（0.382 / 0.5 / 0.618 / 0.786）在 ±0.5×ATR 內：前高低 +2（最多 2 個）、POC +3、成交密集區 +2、均線每條 +1.5、未補缺口 +1.5、前一波段 Fib 疊加 +1、0.5/0.618 +0.5。黃底＝現價已進入共振區。盤中即時價只更新價格與均線，不計入成交密集區。
    </details>
  </section>
  <section id="right">
    <div id="title"><h2 id="tName">—</h2><span class="px" id="tPx"></span><span id="tChg"></span><span id="tDir" class="nm"></span></div>
    <div id="chart"></div>
    <div id="levels"></div>
  </section>
</main>
<div id="toast"></div>

<script>
{
const API='https://api.finmindtrade.com/api/v4/';
const MARKET=['TAIEX','TPEx'],MNAME={TAIEX:'加權指數',TPEx:'櫃買指數'};
const CFG={zz:3.0,minSwing:0.15,ratios:[0.382,0.5,0.618,0.786],tolAtr:0.5,vpWin:120,vpBins:50,mas:[20,60,120,240],maxDist:0.08,
  w:{pivot:2,vp:2,ma:1.5,gap:1.5,fib2:1}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(x,d=2)=>Number.isFinite(x)?x.toFixed(d):'—';
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

/* ───────── 計算 ───────── */
function atrArr(b,n=14){const tr=b.map((x,i)=>i?Math.max(x.h-x.l,Math.abs(x.h-b[i-1].c),Math.abs(x.l-b[i-1].c)):x.h-x.l);
  const out=[];let s=0;for(let i=0;i<tr.length;i++){s+=tr[i];if(i>=n)s-=tr[i-n];out.push(i>=n-1?s/n:NaN)}
  const f=out.find(Number.isFinite);return out.map(v=>Number.isFinite(v)?v:f)}
function sma(b,n){const out=[];let s=0;for(let i=0;i<b.length;i++){s+=b[i].c;if(i>=n)s-=b[i-n].c;out.push(i>=n-1?s/n:NaN)}return out}
function zigzag(b,mult){const a=atrArr(b);const piv=[];let tr=0,hi=0,lo=0;
  for(let i=1;i<b.length;i++){if(b[i].h>b[hi].h)hi=i;if(b[i].l<b[lo].l)lo=i;const th=mult*a[i];
    if(tr>=0&&b[hi].h-b[i].l>th&&hi<i){if(tr===1||!piv.length)piv.push({i:hi,p:b[hi].h,t:'H'});tr=-1;lo=i}
    else if(tr<=0&&b[i].h-b[lo].l>th&&lo<i){if(tr===-1||!piv.length)piv.push({i:lo,p:b[lo].l,t:'L'});tr=1;hi=i}}
  if(tr===1)piv.push({i:hi,p:b[hi].h,t:'H'});else if(tr===-1)piv.push({i:lo,p:b[lo].l,t:'L'});
  return piv}
function volProfile(b,win,bins){const s=b.filter(x=>x.v>0).slice(-win);if(s.length<10)return{poc:NaN,hvn:[]};
  const typ=s.map(x=>(x.h+x.l+x.c)/3),mn=Math.min(...typ),mx=Math.max(...typ),w=(mx-mn)/bins||1,h=new Array(bins).fill(0);
  typ.forEach((t,i)=>{h[Math.min(bins-1,Math.floor((t-mn)/w))]+=s[i].v});
  const ctr=h.map((_,i)=>mn+(i+.5)*w),srt=[...h].sort((a,b)=>a-b),p80=srt[Math.floor(bins*.8)];
  return{poc:ctr[h.indexOf(Math.max(...h))],hvn:ctr.filter((_,i)=>h[i]>=p80)}}
function openGaps(b){const out=[];for(let i=1;i<b.length;i++){
  if(b[i].l>b[i-1].h){const lo=b[i-1].h,hi=b[i].l;if(Math.min(...b.slice(i).map(x=>x.l))>lo)out.push(lo,hi)}
  else if(b[i].h<b[i-1].l){const lo=b[i].h,hi=b[i-1].l;if(Math.max(...b.slice(i).map(x=>x.h))<hi)out.push(lo,hi)}}return out}

function analyze(b){
  if(!b||b.length<CFG.mas.at(-1)+20)return null;
  const piv=zigzag(b,CFG.zz).slice(0,-1);if(piv.length<3)return null;
  const a=atrArr(b).at(-1),tol=CFG.tolAtr*a,close=b.at(-1).c;
  const [p1,p2]=piv.slice(-2);let dir,lo,hi;
  if(p1.t==='L'&&p2.t==='H'){dir='回檔支撐';lo=p1.p;hi=p2.p}else if(p1.t==='H'&&p2.t==='L'){dir='反彈壓力';lo=p2.p;hi=p1.p}else return null;
  if((hi-lo)/lo<CFG.minSwing)return null;
  const up=dir==='回檔支撐',fl=(l,h)=>CFG.ratios.map(r=>up?h-r*(h-l):l+r*(h-l));
  const fibs=fl(lo,hi);let fib2=[];
  if(piv.length>=4){const q1=piv.at(-4),q2=piv.at(-3);if(q1.t===p1.t){const l2=Math.min(q1.p,q2.p),h2=Math.max(q1.p,q2.p);fib2=fl(Math.min(l2,lo),Math.max(h2,hi))}}
  const prior=piv.slice(0,-2).map(p=>p.p),vp=volProfile(b,CFG.vpWin,CFG.vpBins);
  const mas=Object.fromEntries(CFG.mas.map(n=>['MA'+n,sma(b,n).at(-1)])),gaps=openGaps(b.filter(x=>x.v>0).slice(-250));
  const levels=fibs.map((lv,k)=>{const r=CFG.ratios[k],near=x=>Math.abs(x-lv)<=tol,hits=[];let s=0;
    const pv=prior.filter(near);if(pv.length){s+=CFG.w.pivot*Math.min(pv.length,2);hits.push('前高低×'+pv.length)}
    if(near(vp.poc)){s+=CFG.w.vp*1.5;hits.push('POC')}else if(vp.hvn.some(near)){s+=CFG.w.vp;hits.push('密集區')}
    const m=Object.keys(mas).filter(k=>near(mas[k]));if(m.length){s+=CFG.w.ma*m.length;hits.push(m.join('/'))}
    if(gaps.some(near)){s+=CFG.w.gap;hits.push('缺口')}
    if(fib2.some(near)){s+=CFG.w.fib2;hits.push('Fib疊加')}
    if(r===0.5||r===0.618)s+=.5;
    return{r,lv,s,hits,dist:(close-lv)/close,inZone:Math.abs(close-lv)<=tol}});
  const cand=levels.filter(l=>(up?l.dist>=-0.02:l.dist<=0.02)&&Math.abs(l.dist)<=CFG.maxDist)
    .sort((x,y)=>y.s-x.s||Math.abs(x.dist)-Math.abs(y.dist));
  return{dir,up,lo,hi,tol,close,levels,best:cand[0]||null,trendOk:up?close>mas.MA240:close<mas.MA240,piv}}

/* ───────── 資料 ───────── */
async function getJSON(path,params,viaProxy){
  const px=$('proxy').value.trim().replace(/\/+$/,''),base=viaProxy&&px?px+'/api/v4/':API;
  const tok=$('token').value.trim(),q=new URLSearchParams();
  Object.entries(params).forEach(([k,v])=>[].concat(v).forEach(x=>q.append(k,x)));
  let r;
  try{r=await fetch(base+path+'?'+q,{headers:{Authorization:'Bearer '+tok}})}
  catch(e){q.append('token',tok);r=await fetch(base+path+'?'+q)}
  const j=await r.json().catch(()=>({status:r.status,msg:'HTTP '+r.status}));
  if(j.status&&j.status!==200)throw new Error(j.msg||('HTTP '+j.status));return j.data||[]}
const ymd=d=>new Date(d.getTime()+8*3600e3).toISOString().slice(0,10);
async function loadDaily(id){const st=ymd(new Date(Date.now()-760*864e5));
  const d=await getJSON('data',{dataset:'TaiwanStockPrice',data_id:id,start_date:st});
  return d.filter(x=>MARKET.includes(id)?+x.close>0:x.Trading_Volume>0).map(x=>({d:x.date,o:+x.open,h:+x.max,l:+x.min,c:+x.close,v:+x.Trading_Volume}))}
const SNAPID={TAIEX:'001',TPEx:'101'};
async function loadSnaps(ids){const want=ids.map(i=>SNAPID[i]||i),out={};
  let d;try{d=await getJSON('taiwan_stock_tick_snapshot',{data_id:want},true)}
  catch(e){if(/fetch|network|load failed/i.test(e.message)&&!$('proxy').value.trim())throw new Error('FinMind 即時 API 擋瀏覽器直連，請填代理網址');throw e}
  d.forEach(x=>{const id=Object.keys(SNAPID).find(k=>SNAPID[k]===x.stock_id)||x.stock_id;out[id]=x});return out}
let names={};
async function loadNames(){Object.assign(names,MNAME);if(Object.keys(names).length>MARKET.length)return;try{const cached=store.get('fibNames');if(cached){names={...JSON.parse(cached),...MNAME};return}
  const d=await getJSON('data',{dataset:'TaiwanStockInfo'});d.forEach(x=>names[x.stock_id]=x.stock_name);Object.assign(names,MNAME);store.set('fibNames',JSON.stringify(names))}catch(e){}}

function merge(daily,snap){const b=daily.slice();if(!snap||!(+snap.close>0))return b;
  const day=String(snap.date||'').slice(0,10)||ymd(new Date());
  const bar={d:day,o:+snap.open||+snap.close,h:+snap.high||+snap.close,l:+snap.low||+snap.close,c:+snap.close,v:0,live:true};
  if(b.length&&b.at(-1).d===day){bar.v=b.at(-1).v;b[b.length-1]=bar}else if(!b.length||day>b.at(-1).d)b.push(bar);return b}

/* ───────── 狀態 / 畫面 ───────── */
const S={daily:{},rows:{},sel:null,timer:null,alerted:{}};
function isOpen(){const t=new Date(Date.now()+8*3600e3),wd=t.getUTCDay(),m=t.getUTCHours()*60+t.getUTCMinutes();return wd>0&&wd<6&&m>=540&&m<=815}
function toast(msg){const el=document.createElement('div');el.className='t';el.textContent=msg;$('toast').appendChild(el);setTimeout(()=>el.remove(),7000);
  try{if(Notification.permission==='granted')new Notification('Fib 共振',{body:msg})}catch(e){}}
function scColor(s){return s>=6?'background:var(--zone);color:#fff':s>=3?'background:color-mix(in srgb,var(--zone) 30%,transparent)':'color:var(--mute)'}

function renderTable(){const ids=Object.keys(S.rows);
  if(!ids.length){$('tb').innerHTML='<tr><td colspan="6" class="empty">沒有資料</td></tr>';return}
  const mk=x=>MARKET.includes(x)?MARKET.indexOf(x):9;ids.sort((a,b)=>mk(a)-mk(b)||(S.rows[b].res?.best?.s??-1)-(S.rows[a].res?.best?.s??-1));
  $('tb').innerHTML=ids.map(id=>{const r=S.rows[id],res=r.res,b=res?.best,cls=r.chg>0?'up':r.chg<0?'dn':'';
    const hit=b&&b.inZone;
    return `<tr class="row${id===S.sel?' sel':''}${hit?' hit':''}${r.flash?' flash':''}" data-id="${esc(id)}">
      <td><b>${esc(MNAME[id]||id)}</b><span class="nm">${esc(MNAME[id]?id:(names[id]||''))}${r.live?' · 即時':(r.bars?' · 昨收':'')}</span></td>
      <td class="${cls}">${fmt(r.px)}</td><td class="${cls}">${Number.isFinite(r.chg)?(r.chg>0?'+':'')+fmt(r.chg*100)+'%':'—'}</td>
      <td>${b?fmt(b.lv)+'<span class="nm">'+b.r+(res.up?' 撐':' 壓')+'</span>':'<span class="nm">'+(r.err?'錯誤':'無')+'</span>'}</td>
      <td>${b?(b.dist>0?'+':'')+fmt(b.dist*100,1)+'%':''}</td>
      <td>${b?`<span class="sc" style="${scColor(b.s)}">${fmt(b.s,1)}</span>`:''}</td></tr>
      ${r.err?`<tr class="row" data-id="${esc(id)}"><td colspan="6" class="hits" style="color:var(--up)">${esc(r.err)}</td></tr>`:''}
      ${b&&b.hits.length?`<tr class="row${hit?' hit':''}" data-id="${esc(id)}"><td colspan="6" class="hits">${esc(b.hits.join('、'))}${res.trendOk?'':' · 逆大趨勢'}</td></tr>`:''}`}).join('');
  ids.forEach(id=>S.rows[id].flash=false)}

let chart,candle,maS=[],lines=[];
function initChart(){const el=$('chart');const dark=matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.dataset.theme!=='light'||document.documentElement.dataset.theme==='dark';
  chart=LightweightCharts.createChart(el,{autoSize:true,layout:{background:{color:'transparent'},textColor:dark?'#8d919b':'#6b6e76',fontFamily:'Inter'},
    grid:{vertLines:{color:dark?'#23252b':'#efefec'},horzLines:{color:dark?'#23252b':'#efefec'}},rightPriceScale:{borderVisible:false},timeScale:{borderVisible:false},crosshair:{mode:0}});
  candle=chart.addCandlestickSeries({upColor:'#e03131',downColor:'#1f9d55',borderVisible:false,wickUpColor:'#e03131',wickDownColor:'#1f9d55'});
  maS=['#f08c00','#1c7ed6','#2f9e44','#ae3ec9'].map(c=>chart.addLineSeries({color:c,lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false}))}

function renderChart(){const id=S.sel,r=S.rows[id];if(!r||!r.bars)return;if(!chart)initChart();
  const b=r.bars.slice(-260),all=r.bars;
  candle.setData(b.map(x=>({time:x.d,open:x.o,high:x.h,low:x.l,close:x.c})));
  CFG.mas.forEach((n,k)=>{const m=sma(all,n);maS[k].setData(all.map((x,i)=>({time:x.d,value:m[i]})).slice(-260).filter(p=>Number.isFinite(p.value)))});
  lines.forEach(l=>candle.removePriceLine(l));lines=[];
  const res=r.res,cls=r.chg>0?'up':r.chg<0?'dn':'';
  $('tName').textContent=MNAME[id]||(id+' '+(names[id]||''));$('tPx').textContent=fmt(r.px);$('tPx').className='px '+cls;
  $('tChg').className=cls;$('tName').title='';if(!r.live)$('tName').textContent+='（昨收）';$('tChg').textContent=Number.isFinite(r.chg)?(r.chg>0?'+':'')+fmt(r.chg*100)+'%':'';
  if(!res){$('tDir').textContent='沒有符合條件的波段（漲跌幅 < 15% 或資料不足）';$('levels').innerHTML='';return}
  $('tDir').textContent=`${res.dir}｜波段 ${fmt(res.lo)} → ${fmt(res.hi)}（${fmt((res.hi-res.lo)/res.lo*100,1)}%）｜容忍帶 ±${fmt(res.tol)}`;
  res.levels.forEach(l=>{const strong=l.s>=3,col=l.s>=6?'#3b5bdb':strong?'#748ffc':'#909296';
    lines.push(candle.createPriceLine({price:l.lv,color:col,lineWidth:strong?2:1,lineStyle:strong?0:2,axisLabelVisible:true,title:`${l.r} [${fmt(l.s,1)}]`}));
    if(l===res.best){[l.lv-res.tol,l.lv+res.tol].forEach(p=>lines.push(candle.createPriceLine({price:p,color:'#3b5bdb',lineWidth:1,lineStyle:1,axisLabelVisible:false,title:''})))}});
  $('levels').innerHTML=res.levels.map(l=>`<div class="lv${l===res.best?' best':''}"><small>Fib ${l.r}</small><b>${fmt(l.lv)}</b> <span class="sc" style="${scColor(l.s)}">${fmt(l.s,1)}</span>
    <small>${esc(l.hits.join('、')||'無共振')}｜距現價 ${(l.dist>0?'+':'')+fmt(l.dist*100,1)}%</small></div>`).join('')}

async function refresh(full){const own=$('list').value.split(/[\s,，]+/).map(s=>s.trim()).filter(Boolean);
  const ids=[...new Set([...MARKET,...own])];
  if(!$('token').value.trim()){$('status').textContent='請先輸入 token';return}
  store.set('fibToken',$('token').value.trim());store.set('fibProxy',$('proxy').value.trim());store.set('fibList',own.join(','));
  $('status').textContent='更新中…';await loadNames();
  Object.keys(S.rows).forEach(k=>{if(!ids.includes(k))delete S.rows[k]});
  const today=ymd(new Date());let liveN=0,err=0,snaps={},snapErr='',snapT='';
  try{snaps=await loadSnaps(ids)}catch(e){snapErr=String(e.message||e)}
  Object.values(snaps).forEach(x=>{const t=String(x.date||'').slice(11,19);if(t>snapT)snapT=t});
  await Promise.all(ids.map(async id=>{try{
    if(full||!S.daily[id])S.daily[id]=await loadDaily(id);
    const snap=snaps[id]||null,bars=merge(S.daily[id],snap);
    const res=analyze(bars),last=bars.at(-1),prev=bars.at(-2),old=S.rows[id];
    const row={bars,res,px:last?.c,chg:prev?last.c/prev.c-1:NaN,live:!!(snap&&last?.live),flash:old&&old.px!==last?.c};
    if(row.live)liveN++;S.rows[id]=row;
    const b=res?.best,key=id+today+(b?.r);
    if(b&&b.inZone&&b.s>=3&&!S.alerted[key]){S.alerted[key]=1;toast(`${id} ${names[id]||''} 進入 ${b.r} 共振區 ${fmt(b.lv)}（分數 ${fmt(b.s,1)}：${b.hits.join('、')}）`)}
  }catch(e){err++;const m=String(e.message||e);S.rows[id]={err:/Failed to fetch|NetworkError|Load failed/i.test(m)?'連不到 FinMind（此環境擋掉網路，請用 GitHub Pages 或瀏覽器開啟）':m}}}));
  if(!S.sel||!S.rows[S.sel])S.sel=S.rows.TAIEX?.bars?'TAIEX':(ids.find(i=>S.rows[i]?.res)||ids[0]);
  renderMkt();
  renderTable();renderChart();
  const t=new Date(Date.now()+8*3600e3).toISOString().slice(11,19);
  $('status').innerHTML=`${isOpen()?'<b>●</b> 盤中':'收盤'}｜更新 ${t}｜報價時間 ${snapT||'—'}｜即時 ${liveN}/${ids.length}${err?`｜錯誤 ${err}`:''}${snapErr?`｜即時報價失敗：${esc(snapErr)}`:''}`}

function renderMkt(){$('mkt').innerHTML=MARKET.map(id=>{const r=S.rows[id];if(!r||!Number.isFinite(r.px))return'';const c=r.chg>0?'up':r.chg<0?'dn':'',b=r.res?.best;
    return `<button class="mk ghost" data-id="${id}"><span>${MNAME[id]}</span> <b class="${c}">${fmt(r.px)}</b> <span class="${c}">${(r.chg>0?'+':'')+fmt(r.chg*100)}%</span>${b?` <small>${b.r}${r.res.up?'撐':'壓'} ${fmt(b.lv,0)}</small>`:''}</button>`}).join('')}
$('mkt').addEventListener('click',e=>{const t=e.target.closest('[data-id]');if(!t)return;S.sel=t.dataset.id;renderTable();renderChart()});
function schedule(){clearInterval(S.timer);const s=+$('iv').value;if(s>0)S.timer=setInterval(()=>{if(isOpen())refresh(false)},s*1000)}

$('tb').addEventListener('click',e=>{const tr=e.target.closest('tr[data-id]');if(!tr)return;S.sel=tr.dataset.id;renderTable();renderChart()});
$('go').addEventListener('click',()=>{refresh(true);schedule()});
$('iv').addEventListener('change',schedule);
$('list').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
$('notify').addEventListener('click',async()=>{try{const p=await Notification.requestPermission();$('notify').textContent=p==='granted'?'通知已開':'通知被拒'}catch(e){$('notify').textContent='不支援'}});
const p0=store.get('fibProxy');if(p0)$('proxy').value=p0;
const t0=store.get('fibToken'),l0=store.get('fibList');if(t0)$('token').value=t0;if(l0)$('list').value=l0;
if(t0){refresh(true);schedule()}
window.__fib={analyze,zigzag,merge};
}
</script>
